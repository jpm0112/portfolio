<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Mobile navigation check</title>
<iframe src="../index.html" width="390" height="844" title="Portfolio under test"></iframe>
<pre id="result">Running…</pre>
<script type="module">
  const frame = document.querySelector('iframe');
  const result = document.querySelector('#result');
  try {
    if (!frame.contentDocument?.querySelector('#navToggle')) {
      await new Promise(resolve => frame.addEventListener('load', resolve, { once: true }));
    }
    const doc = frame.contentDocument;
    const toggle = doc.querySelector('#navToggle');
    const links = doc.querySelector('#navLinks');
    const check = (condition, message) => { if (!condition) throw new Error(message); };

    check(frame.contentWindow.getComputedStyle(links).visibility === 'hidden', 'Closed links remain visible');
    toggle.click();
    check(toggle.getAttribute('aria-expanded') === 'true', 'Menu did not open');
    doc.dispatchEvent(new KeyboardEvent('keydown', { key: 'Escape', bubbles: true }));
    check(toggle.getAttribute('aria-expanded') === 'false' && doc.activeElement === toggle, 'Escape did not close and return focus');
    toggle.click();
    links.querySelector('a[href="#projects"]').click();
    check(toggle.getAttribute('aria-expanded') === 'false' && doc.activeElement.id === 'projects', 'Navigation did not move focus to the section');
    result.textContent = 'PASS: mobile navigation';
    result.dataset.status = 'pass';
  } catch (error) {
    result.textContent = `FAIL: ${error.message}`;
    result.dataset.status = 'fail';
  }
</script>
</html>
